{{ template "header" . }}

<style>
    /* 1. 废除 MVP.css 的横向布局，改为垂直堆叠 */
    section {
        display: block !important; /* 强制变成普通块级元素 */
        padding: 0;
        border: none;
        box-shadow: none;
        max-width: 100%;
    }

    /* 2. 针对每一篇文章的容器进行美化 */
    .post-item {
        text-align: left; /* 关键：强制左对齐，解决“没对齐”的问题 */
        border-bottom: 1px solid #eaeaea; /* 加一条淡淡的分割线 */
        padding-bottom: 2rem;
        margin-bottom: 2rem;
        width: 100%;
    }

    /* 3. 让标题更好看 */
    .post-item h2 {
        margin-top: 0;
        margin-bottom: 0.5rem;
    }

    /* 4. 摘要文字颜色浅一点 */
    .post-item p {
        color: #555;
        line-height: 1.6;
    }

    /* 5. 按钮左对齐微调 */
    .post-item button {
        margin-left: 0; /* 抵消默认的 margin */
        padding: 8px 16px;
        font-size: 0.9rem;
    }
</style>

<section>
    <h1 style="margin-bottom: 40px;">📚 最新文章</h1>

    {{ range .posts }}
    <div class="post-item">
        <header>
            <h2><a href="/post/{{.ID}}" style="color: #333; text-decoration: none;">{{ .Title }}</a></h2>
            <span class="date">发布于: {{ .CreatedAt.Format "2006-01-02" }}</span>
        </header>
        <p>
            {{ .Summary }}
        </p>
        <a href="/post/{{.ID}}"><button>阅读全文 &rarr;</button></a>
    </div>
    {{ end }}

</section>

{{ template "footer" . }}
